name: Update Stats Cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_border=true&include_all_commits=true&count_private=true&bg_color=0D1117&title_color=9D4EDD&icon_color=44D62C&text_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_border=true&include_all_commits=true&count_private=true&layout=compact&langs_count=10&bg_color=0D1117&title_color=9D4EDD&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "update stats cards" || exit 0
          git push
